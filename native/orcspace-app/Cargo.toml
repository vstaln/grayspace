[package]
name = "orcspace-app"
version = "0.1.0"
edition = "2021"
description = "Native Rust OrcSpace desktop application"

[[bin]]
name = "orcspace"
path = "src/main.rs"

[[bin]]
name = "orc"
path = "src/orc.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
eframe = "0.36.1"
egui = "0.36.1"
portable-pty = "0.9"
rodio = { version = "0.22.2", features = ["playback"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }
