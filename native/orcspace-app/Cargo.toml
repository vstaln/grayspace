[package]
name = "orcspace-app"
version = "0.1.0"
edition = "2021"
description = "Native Rust OrcSpace desktop application"

[[bin]]
name = "orcspace"
path = "src/main.rs"

[[bin]]
name = "orc"
path = "src/orc.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
eframe = "0.36.1"
egui = "0.36.1"
portable-pty = "0.9"
rodio = { version = "0.22.2", features = ["playback"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }

# Unix only: kill(2) on a negative pid is what reaps a terminal's whole
# process group. Already in the dependency graph via portable-pty, so this
# adds no new crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows only: listing a shell's children is what lets a terminal that has
# stopped reading its input be interrupted without killing the shell along
# with it. Already in the dependency graph via portable-pty; only the
# tlhelp32 module is new.
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["handleapi", "tlhelp32", "jobapi2", "processthreadsapi"] }
