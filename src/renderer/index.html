<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      SEC-005: defense-in-depth. The renderer is trusted input-free today, but
      if anything ever injects markup this policy keeps it from running scripts
      or reaching the network beyond the dev server. 'unsafe-inline' for style
      only: React lays out widgets with inline style attributes.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' orc: http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; script-src 'self' orc: 'unsafe-inline' 'unsafe-eval' http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:* https://www.youtube.com https://s.ytimg.com https://*.youtube.com; style-src 'self' orc: 'unsafe-inline' http://localhost:* http://127.0.0.1:*; img-src 'self' orc: data: blob: http://localhost:* http://127.0.0.1:* https://i.ytimg.com https://*.ytimg.com https://*.googleusercontent.com; font-src 'self' orc: data: http://localhost:* http://127.0.0.1:*; connect-src 'self' orc: ws://localhost:* http://localhost:* ws://127.0.0.1:* http://127.0.0.1:* https://www.youtube.com https://*.googlevideo.com https://*.youtube.com https://*.google.com https://*.ytimg.com; media-src 'self' orc: blob: http://localhost:* http://127.0.0.1:* https: https://*.googlevideo.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://*.youtube.com https://open.spotify.com https://music.yandex.ru https://music.yandex.com; object-src 'none'; base-uri 'none'"
    />
    <title>OrcSpace</title>
  </head>
  <body style="margin:0;background:#080808;color:#e8e8ea;font-family:Inter,system-ui,sans-serif">
    <!-- Visible while the renderer bundle is loading (or reports a startup
         error); a blank root is indistinguishable from a crashed window. -->
    <div id="root">
      <div style="display:grid;place-items:center;height:100vh;font-size:13px;letter-spacing:.02em">
        Starting OrcSpace…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
