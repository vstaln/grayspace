name: Native Rust

on:
  push:
    paths: ['native/**', '.github/workflows/native.yml', 'package.json', 'package-lock.json']
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml', 'package.json', 'package-lock.json']
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        if: runner.os == 'Windows'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo fmt --manifest-path native/Cargo.toml --all -- --check
      - run: cargo test --manifest-path native/Cargo.toml --workspace --locked
      - run: cargo clippy --manifest-path native/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - run: cargo build --manifest-path native/Cargo.toml --release --bins --locked
