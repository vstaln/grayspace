name: E2E

# Desktop end-to-end tests via Playwright against a real Electron build.
# Windows is the only target of this project's packaging, and headful Electron
# needs no extra services there, so the job runs on windows-latest.

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      # `npm run build` runs `prebuild` → `npm run build:mcp` first, which
      # installs and builds the sibling repo materialized above.
      - name: Build the app
        run: npm run build

      - name: Run Playwright E2E
        run: npm run test:e2e:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14