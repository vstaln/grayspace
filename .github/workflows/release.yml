name: Build installers

# Produces the shippable installers for Linux and Windows and, for a v* tag,
# publishes them together with the auto-update feeds.
#
# Linux and Windows installers are built on their native GitHub-hosted runners;
# electron-builder cannot cross-build either target reliably.
#
# Auto-update: installed apps read the GitHub release of orcspace/Orcspace-Uptade
# (a public repository) and look for one feed file per platform:
#   latest.yml        Windows (NSIS)
#   latest-linux.yml  Linux    (AppImage and .deb)
# All of them are uploaded to that release, next to the installers they describe.
#
# Secrets (all optional except UPDATE_RELEASE_TOKEN for publishing):
#   UPDATE_RELEASE_TOKEN        token with contents:write on orcspace/Orcspace-Uptade
#
# Artifacts are attached to the run — download them from the run's summary page.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: orcspace-release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing should still leave the other's installer available.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            script: dist:linux
            build_args: '-- --skip-ci --skip-tests'
            artifacts: |
              dist/installers/linux/*.AppImage
              dist/installers/linux/*.deb
              dist/installers/linux/*.tar.gz
              dist/installers/linux/latest-linux.yml
              dist/installers/linux/checksums-linux.json
          - os: windows-latest
            name: windows
            script: dist
            build_args: '-- --skip-ci --skip-tests'
            artifacts: |
              dist/installers/windows/*.exe
              dist/installers/windows/*.exe.blockmap
              dist/installers/windows/latest.yml
              dist/installers/windows/checksums.json

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libclang-dev libfontconfig1-dev libgtk-3-dev \
            libssl-dev libwayland-dev libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev xvfb

      # 24, not 22: `npm test` runs `node --test` straight over .ts files, which
      # relies on native type stripping (unflagged from Node 23.6). On 22 the
      # test step would fail to parse every test file.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The native crates are optional accelerations: native/build.mjs
      # detects a missing toolchain and falls back to the TypeScript paths, so
      # the build never fails for want of Rust. Installing it anyway means the
      # shipped app gets the fast paths.
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify Electron bytecode compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          printf 'module.exports = 42;\n' > "$RUNNER_TEMP/bytecode-probe.js"
          ELECTRON_ENABLE_LOGGING=1 xvfb-run -a node_modules/.bin/electron scripts/compile-main-bytecode.cjs "$RUNNER_TEMP/bytecode-probe.js"
          test -s "$RUNNER_TEMP/bytecode-probe.jsc"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Typecheck
        run: npm run typecheck

      - name: Verify release version metadata
        run: npm run check:version

      - name: Prepare native engine for Windows integration tests
        if: runner.os == 'Windows'
        run: node scripts/ensure-native-engine.mjs
        env:
          ORCSPACE_NATIVE_STRICT: '1'

      # The Linux runner executes the complete JS + Rust suite.  The hosted
      # Windows runner can leave the conpty integration tests waiting forever;
      # Windows still goes through typecheck, native-engine preparation, and
      # the actual packaged build below.
      - name: Unit tests (Linux)
        if: runner.os == 'Linux'
        run: npm test

      - name: Verify Windows native engine
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'native/target/release/orcspace.exe')) {
            throw 'The Windows native engine was not produced.'
          }

      - name: Build the installer
        run: npm run ${{ matrix.script }} ${{ matrix.build_args }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Note what was produced
        shell: bash
        run: |
          echo "### ${{ matrix.name }} installers" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find dist -maxdepth 4 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.exe.blockmap' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.tar.gz' -o -name 'latest*.yml' -o -name 'checksums*.json' \) -print0 | xargs -0 -r ls -lh | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Windows: SmartScreen shows 'More info → Run anyway' until the .exe builds reputation." >> "$GITHUB_STEP_SUMMARY"
          echo "Linux: AppImage requires \`chmod +x\`; .deb can be installed via \`sudo dpkg -i\`. Only the AppImage and .deb update themselves." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: orcspace-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      # Publish both platform installers to the source repository.
      - name: Publish installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/orcspace-windows/*.exe
            release-assets/orcspace-windows/*.exe.blockmap
            release-assets/orcspace-windows/latest.yml
            release-assets/orcspace-windows/checksums.json
            release-assets/orcspace-linux-x64/*.AppImage
            release-assets/orcspace-linux-x64/*.deb
            release-assets/orcspace-linux-x64/*.tar.gz
            release-assets/orcspace-linux-x64/latest-linux.yml
            release-assets/orcspace-linux-x64/checksums-linux.json
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      - name: Publish installers and update feeds for in-app updates
        uses: softprops/action-gh-release@v2
        with:
          repository: orcspace/Orcspace-Uptade
          token: ${{ secrets.UPDATE_RELEASE_TOKEN }}
          files: |
            release-assets/orcspace-windows/*.exe
            release-assets/orcspace-windows/*.exe.blockmap
            release-assets/orcspace-windows/latest.yml
            release-assets/orcspace-windows/checksums.json
            release-assets/orcspace-linux-x64/*.AppImage
            release-assets/orcspace-linux-x64/*.deb
            release-assets/orcspace-linux-x64/*.tar.gz
            release-assets/orcspace-linux-x64/latest-linux.yml
            release-assets/orcspace-linux-x64/checksums-linux.json
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
